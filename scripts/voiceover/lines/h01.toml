[[line]]
id = 1000017
index = 0
display = "The Godfather"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 0
display = "Young Robin of Locksley left his cherished land some years ago to follow the valiant King Richard the Lion Heart in the Crusades. Now, finally, he has returned, but it seems that his fighting days are far from over. In fact, King Richard has yet to return from the Holy Land. In his absence, power is in the hands of Prince John Lackland, his brother. But the vassals do not seem to respect his authority: the Sheriff of Nottingham, in particular, is using his position to tax the country folk so heavily that they are reduced to the most abject poverty."
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 1
display = "Even worse: Robin learns that his father, Lord Locksley, died of old age while he was away. And the Sheriff took advantage of this to claim that Robin had also met his death - struck down by the infidels - and confiscate his lands in the name of the Crown! Now Robin has been disinherited, robbed of his estate by this loutish Sheriff's embezzling. Our hero is left with but one solution: he must go to Lincoln."
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 2
display = "Lincoln! It is here that Robin spent his youth, with an old friend of his father's, Lord Godwin. It was under his guidance that Robin learnt to fight and use a bow and arrow: what better ally could he find in such circumstances! But as our hero enters his Godfather's castle, his face fortunately concealed by his hood, a painful surprise awaits him: the castle is teeming with men bearing the arms of the Sheriff of Nottingham! We must find Godwin... and hope that the Sheriff's men do not notice Robin!"
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 3
display = "\"Thanks to your intervention, I managed to escape from the brutes who were harassing me! I don't know how to thank you… Yes! I know! Take this: it's a lucky charm that my grandmother gave me. She said that thanks to this, if ever I were seriously wounded, I would escape death. Take it, it will save you from the worst. But, beware: you will need the help of a friend to revive you; if you are alone, this four leaf clover will not be able to come to your aid...\""
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 4
display = "I saw Master Worman receiving some purses from the Sheriff! He must be counting his money, as we speak…"
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 5
display = "\"Bunch of incompetent fools! I warn you, you won't get anything to eat until I see an arrow in the bull's-eye of one of these targets! Come on, start again!\""
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 6
display = "\"Finally! Oh, what a lovely arrow! Well, don't look so flabbergasted! Right, everyone to the mess!\""
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 7
display = "\"It is said that Haldric 'the Knight' has suddenly become rich, since the Sheriff's men came to the castle… He has a lot of gold on him, yet he never gives alms, the skinflint!\""
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 8
display = "\"Ah! Master Robin, is that you? I'm so happy to see you! The Sheriff announced that you died in the crusades! So, old Stutley was right: it was just a stratagem so that the Sheriff could claim your lands! But that means you are in danger, master Robin!\""
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 9
display = "\"No, my lord, I do not know where Sir Godwin is. He has disappeared, and the Sheriff's men have taken possession of the castle to help them in their search for him, so they say… But I am afraid he may have come to some harm… Just as you are in danger of coming to harm if you do not leave this place! The Sheriff is unlikely to relish the fact that you have returned...\""
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 10
display = "\"Listen: I shall inform my son, who lives in the village to the West of the castle; he will help you get away… that is all I can do; you must leave the castle enclosure by your own means. Good luck, master Robin.\""
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 11
display = "\"Master Robin! My father sent word, and I have everything arranged to help you leave Lincoln. Ah, what sad times these are! The taxes have become unbearable, and the Sheriff's greedy men resort to all kinds of extortion to fill their pockets! Only brave Stutely has tried to stand up against their money-grabbing schemes, but soon they are to hang him at Nottingham! No, these really are sad times... As soon as you are ready to leave, let me know!\" (To leave Lincoln, click on the top right icon)"
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 12
display = "The ivy is secure enough for Robin to hang on to it and scale the walls!"
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 13
display = "When an arrow like this one appears, it means that Robin can jump on or over the obstacle! Watch out: not everyone is as agile as Robin."
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 14
display = "It's often useful to knock out an opponent. To do that, select this icon, then click on the victim… The size of the stars over the victim's head indicates how long it will be before he comes to."
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 15
display = "Soldiers are sometimes sensitive to the lure of gold… All you have to do is select the purse, and then throw it. Some soldiers, such as lancers, will go and see what's going on. It may even cause a brawl!"
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 16
display = "The beggars know a lot… But each piece of information will cost a little of Robin's money. Click on the beggar you want to buy some information from!"
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 17
display = "Anyhow, someone appears to have lost their purse! It's probably empty, but it will be of use to Robin… If he has enough money to fill it! To pick it up, just click on it."
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 18
display = "This man is none other than Edward, one of Godwin's servants. Robin knew him well as a child; he will probably be able to tell Robin where to find Godwin."
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 19
display = "Uh-oh! It looks as though one of the soldiers was in such a hurry to go and have his supper that he forgot his purse… It looks quite full: no doubt as a result of a bet on the performance of his comrade… Robin understands why he was so happy, now…"
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 20
display = "The easiest way of activating the drawbridge mechanism is by cutting the rope…"
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 21
display = "If that doesn't work, you can always attack an adversary: just click on it… During combat, just click or double click on the adversary to attack them, or click on Robin to make him try and fend off the blows from his enemy. Finally, by holding down the button on the mouse whilst moving it, you can give Robin the order to make a circular attack, strike from the right, etc. If the enemy proves to be too strong, try and draw a horizontal figure of 8 with the mouse..."
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 22
display = "To use Robin's bow, click on the arrow drawn above his picture, then aim at one of the targets. When the cursor arrow turns green, click, and Robin will shoot! But first of all, you need to gather some arrows…"
spoken = ""
voice = "narrator"
provenance = "machine-draft"

[[line]]
id = 1000349
index = 0
display = "With the help of Edward's son, Robin managed to leave the estate of Lincoln, but his situation is far from brilliant: he was unable to find his godfather, and has nowhere to try and take refuge. What's more, the young man informs our hero that the situation is even worse than he feared. The Sheriff reigns over the region with an iron fist, and has anyone who dares to stand up to him executed. Only a small group of men, led by a craftsman, Stutely, has dared to defy him. Unfortunately, they were arrested a short time ago, and will soon meet the fate the Sheriff reserves for \"highwaymen\": hanging. These men could be a great help to Robin; we must go and free them."
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000350
index = 0
display = "Hell! Robin has been slain by the Sheriff's formidable soldiers! All we can do now is start another game…"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 0
display = "Robin must get into the castle to find Godwin."
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 1
display = "Edward's son awaits Robin in the village to help him leave the town!"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 2
display = "Edward's brave son will take Robin to a safe place as soon as he tells him he wants to leave."
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 3
display = "Master Worman has received some money from the Sheriff… Ill-gotten gains could be of use for Robin!"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 4
display = "Haldric the knight has been bribed by the Sheriff; why not rob him?"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 5
display = "These bowmen are far too clumsy! By hitting one of the targets with an arrow, Robin could put an end to the training session. The path to the beggar would then be clear!"
spoken = ""
voice = "none"
provenance = "machine-draft"

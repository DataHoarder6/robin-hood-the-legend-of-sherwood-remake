[[line]]
id = 1000017
index = 0
display = "The Godfather"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000105
index = 0
display = "Prieš keletą metų jaunasis Robinas iš Loksli paliko brangų kraštą ir išvyko sekti narsų karalių Ričardą Liūtaširdį į kryžiaus žygį. Dabar jis pagaliau grįžo, bet atrodo, kad kovos dar toli gražu nesibaigė. Karalius Ričardas dar negrįžo iš Šventosios žemės. Jam nesant, valdžia atiteko jo broliui, princui Džonui Bežemiui. Tačiau vasalai, regis, negerbia jo valdžios: ypač Notingamo šerifas naudojasi savo padėtimi ir taip sunkiai apmokestina kaimo žmones, kad šie atsiduria didžiausiame skurde."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 1
display = "Dar blogiau: Robinas sužino, kad jo tėvas, lordas Loksli, jam išvykus mirė senatvėje. Šerifas tuo pasinaudojo ir paskelbė, kad Robinas taip pat žuvo – neva jį nužudė netikintieji – ir karūnos vardu konfiskavo jo žemes! Dabar Robinas yra išvarytas iš palikimo, apiplėštas šio šiurkštaus šerifo. Mūsų herojui lieka tik viena išeitis: jis privalo vykti į Linkolną."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 2
display = "Linkolnas! Čia Robinas praleido jaunystę su senu tėvo draugu, lordu Godvinu. Būtent jo vadovaujamas Robinas išmoko kovoti ir naudotis lanku su strėle: kokio dar geresnio sąjungininko jis galėtų tikėtis tokiomis aplinkybėmis! Tačiau kai mūsų herojus įžengia į krikštatėvio pilį – veidą, laimei, slepia gobtuvas – jo laukia skaudi staigmena: pilyje knibžda Notingamo šerifo karių! Turime rasti Godviną... ir tikėtis, kad šerifo žmonės nepastebės Robino!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 3
display = "Dėkoju už jūsų įsikišimą, pavyko pabėgti nuo mane užpuolusių žiaurūnų! Nežinau, kaip jums atsidėkoti… Taip! Žinau! Štai, paimkite: tai laimės talismanas, kurį man padovanojo močiutė. Ji sakė, kad su juo, jei kada nors būčiau sunkiai sužeistas, išvengčiau mirties. Paimkite, jis apsaugos jus nuo blogiausio. Bet saugokitės: kad atgaivintumėte, prireiks draugo pagalbos; vienam šis keturlapis dobilas nepadės..."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 4
display = "Mačiau, kaip meistras Vorman gavo iš šerifo piniginius! Jis tikriausiai dabar juos skaičiuoja…"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 5
display = "Kokia nevykėlių gauja! Įspėju, jūs negausite valgyti, kol nepataikysiu strėle į patį taikinio centrą! Na, pradėkite iš naujo!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 6
display = "Pagaliau! O, kokia graži strėlė! Na, nestebekite taip! Visi į valgyklą!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 7
display = "Sakoma, kad Haldrikas „Riteris“ staiga praturtėjo, kai šerifo kariai atvyko į pilį… Jis turi daug aukso, bet niekada neduoda išmaldos, šykštuolis!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 8
display = "Ak! Mokytojau Robinai, ar tai jūs? Taip džiaugiuosi jus matydamas! Šerifas paskelbė, kad žuvote kryžiaus žygyje! Vadinasi, senasis Stutlis buvo teisus: tai buvo tik gudrybė, kad šerifas galėtų pasiimti jūsų žemes! Bet tai reiškia, kad jūs esate pavojuje, mokytojau Robinai!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 9
display = "Ne, valdove, nežinau, kur yra seras Godvinas. Jis dingo, o šerifo žmonės, kaip sakoma, užėmė pilį, kad padėtų jo ieškoti… Bet bijau, kad jam galėjo atsitikti nelaimė… Taip pat ir jums gresia pavojus, jei neišeisite iš šios vietos! Šerifui tikriausiai visai nepatiks, kad grįžote..."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 10
display = "Klausykite: pranešiu savo sūnui, kuris gyvena kaime į vakarus nuo pilies; jis padės jums pabėgti… daugiau nieko negaliu padaryti; iš pilies teritorijos turite išeiti patys. Sėkmės, mokytojau Robinai."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 11
display = "Mokytojau Robinai! Tėvas atsiuntė žinią, ir aš viską sutvarkiau, kad padėčiau jums palikti Linkolną. Ak, kokie liūdni laikai! Mokesčiai tapo nepakeliami, o šerifo godūs žmonės griebiasi įvairiausių išspaudimų, kad pripildytų kišenes! Tik narsusis Stutlis bandė pasipriešinti jų pinigų grobimo pinklėms, bet netrukus jie jį pakars Notingale! Ne, tikrai liūdni laikai… Kai būsite pasiruošę išvykti, duokite man žinią! (Kad paliktumėte Linkolną, spauskite dešiniajame viršutiniame kampe esančią piktogramą)"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 12
display = "Gebenės pakankamai tvirtos, kad Robinas galėtų jomis kabintis ir lipti sienomis!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 13
display = "Kai pasirodo tokia strėlė, tai reiškia, kad Robinas gali šokti ant kliūties arba per ją! Saugokitės: ne visi tokie vikrūs kaip Robinas."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 14
display = "Dažnai naudinga apsvaiginti priešininką. Norėdami tai padaryti, pasirinkite šią piktogramą, tada spauskite ant aukos… Žvaigždutės virš aukos galvos rodo, kiek laiko užtruks, kol ji atsipeikės."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 15
display = "Kartais karius vilioja auksas… Tereikia pasirinkti piniginę ir ją mesti. Kai kurie kariai, pavyzdžiui, ietininkai, eis pažiūrėti, kas vyksta. Gali net kilti muštynės!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 16
display = "Elgetos daug žino… Bet už kiekvieną žinią Robinas sumokės dalį savo pinigų. Spauskite ant elgetos, iš kurios norite pirkti informacijos!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 17
display = "Matyt, kažkas pametė piniginę! Joje tikriausiai tuščia, bet Robinui ji pravers… jei jis turės kuo ją užpildyti! Norėdami pakelti, tiesiog spauskite ant jos."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 18
display = "Šis žmogus – ne kas kitas, o Edvardas, vienas iš Godvino tarnų. Robinas jį gerai pažinojo vaikystėje; jis tikriausiai galės pasakyti, kur rasti Godviną."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 19
display = "Oi! Atrodo, vienas karių taip skubėjo į vakarienę, kad pamiršo savo piniginę… Ji atrodo gana pilna: neabejotinai dėl lažybų dėl draugo pasirodymo… Dabar Robinas supranta, kodėl jis buvo toks linksmas…"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 20
display = "Paprasčiausias būdas įjungti pakeliamo tilto mechanizmą – nupjauti virvę…"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 21
display = "Jei tai nepavyks, visada galite pulti priešininką: tiesiog spauskite ant jo… Kovos metu spauskite arba dukart spauskite ant priešininko, kad jį užpultumėte, arba spauskite ant Robino, kad jis bandytų atremti smūgius. Be to, laikydami nuspaustą pelės mygtuką ir judindami ją, galite įsakyti Robinui atlikti apskritą smūgį, smūgį iš dešinės ir kt. Jei priešas pasirodys per stiprus, pabandykite pele nubrėžti horizontalią aštuoneto figūrą..."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000105
index = 22
display = "Norėdami naudoti Robino lanką, spauskite ant strėlės, nupieštos virš jo portreto, tada nutaikykite į vieną iš taikinių. Kai žymeklio strėlė pasidarys žalia, spauskite – ir Robinas šaus! Bet pirmiausia reikia prisirinkti strėlių…"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000349
index = 0
display = "With the help of Edward's son, Robin managed to leave the estate of Lincoln, but his situation is far from brilliant: he was unable to find his godfather, and has nowhere to try and take refuge. What's more, the young man informs our hero that the situation is even worse than he feared. The Sheriff reigns over the region with an iron fist, and has anyone who dares to stand up to him executed. Only a small group of men, led by a craftsman, Stutely, has dared to defy him. Unfortunately, they were arrested a short time ago, and will soon meet the fate the Sheriff reserves for \"highwaymen\": hanging. These men could be a great help to Robin; we must go and free them."
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000350
index = 0
display = "Hell! Robin has been slain by the Sheriff's formidable soldiers! All we can do now is start another game…"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 0
display = "Robin must get into the castle to find Godwin."
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 1
display = "Edward's son awaits Robin in the village to help him leave the town!"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 2
display = "Edward's brave son will take Robin to a safe place as soon as he tells him he wants to leave."
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 3
display = "Master Worman has received some money from the Sheriff… Ill-gotten gains could be of use for Robin!"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 4
display = "Haldric the knight has been bribed by the Sheriff; why not rob him?"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000283
index = 5
display = "These bowmen are far too clumsy! By hitting one of the targets with an arrow, Robin could put an end to the training session. The path to the beggar would then be clear!"
spoken = ""
voice = "none"
provenance = "machine-draft"

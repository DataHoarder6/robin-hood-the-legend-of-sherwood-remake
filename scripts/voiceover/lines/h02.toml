provenance = "machine-draft"

[[line]]
id = 1000018
index = 1
display = "Fair Marian, the love of Robin's youth, lives in Nottingham…"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000018
index = 2
display = "Before leaving for the crusades, Robin was planning to ask the fair Marian for her hand. Although he is no longer an outlaw, he is convinced the girl could help him. Perhaps she will be able to tell him what has become of Godwin? Or help our hero to recover his rights? To find out, Robin will have to take the risk of venturing into Nottingham once more..."
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000445
index = 0
display = "Labas vakaras, mano vaikeli. Sėskis. In nomine patris..."
spoken = ""
voice = "robin"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 1
display = "Jūsų balsas labai keistas, tėve... Gal paragavote daugiau savo vienuolyno skanaus alaus, nei derėtų?"
spoken = ""
voice = "marian"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 2
display = "Mano vaikeli, būtų menkas padėkingumas mūsų Kūrėjui, jei negalėtume džiaugtis žemės vaisiais ir savo triūso rezultatais..."
spoken = ""
voice = "robin"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 3
display = "Keistas požiūris... Bet jūsų balsas niekada nebuvo toks keistas... Ir jūs ne brolis Tukas!"
spoken = ""
voice = "marian"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 4
display = "Ššš! Nusiramink, Marijana, tai aš, Robinas! Robinas iš Loksli!"
spoken = ""
voice = "robin"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 5
display = "Robinas? Nedrįstu tikėti! Sakė, kad žuvote Šventojoje žemėje... Tai kur brolis Tukas?"
spoken = ""
voice = "marian"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 6
display = "Hm, brolis Tukas... medituoja. Taip, būtent, jis medituoja. Labai giliai. Manau, jis dar kelias valandas medituos..."
spoken = ""
voice = "robin"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 7
display = "Vargšas brolis Tukas!"
spoken = ""
voice = "marian"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 8
display = "Deja, Marijana, tai buvo vienintelis būdas tave pamatyti... Šerifas manęs ieško, jis bijo, kad pareikšiu teisę į savo palikimą."
spoken = ""
voice = "robin"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 9
display = "Tiesa. Tavo vargšas tėvas. O, Robinas, taip išsigandau, kai išgirdau, kad žuvai. Bet ką dabar darysi? Šerifas klastingas ir žiaurus, jis niekada negrąžins tau žemių! Kur gyvensi?"
spoken = ""
voice = "marian"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 10
display = "Na, aš... su keliais draugais slepiamės Šervudo miške ir..."
spoken = ""
voice = "robin"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 11
display = "Ką? Ar tu tas plėšikas, tas nusikaltėlis, kurio ieško šerifas, tas Robinas Hudas?"
spoken = ""
voice = "marian"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 12
display = "Nesijaudink, Marijana, mano linksmieji vyrai ir aš prisiekėme tik puldinėti šerifo karius, kad iš vargšų atimtus pinigus grąžintume jiems!"
spoken = ""
voice = "robin"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 13
display = "Negaliu leisti tau tęsti, Robinai! Kažkas turi būti padaryta... Esu tikra, kad princas Džonas išklausys tavo skundo prieš Notingamo šerifą, privalai su juo susitikti."
spoken = ""
voice = "marian"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 14
display = "Bet kur aš galiu su juo susitikti? Ar jis sutiks priimti paprastą nusikaltėlį?"
spoken = ""
voice = "robin"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 15
display = "Aš tau padėsiu, mano drauge. Princas netrukus atvyks į šias apylinkes. Nueisime pas jį kartu, aš už tave kalbėsiu. O kol kas saugokis, gerasis Robinai. Išeik, kol kas nors neaptiko brolio Tuko „meditacijos“! Aš su tavimi susisieksiu, na, eik, eik!"
spoken = ""
voice = "marian"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 16
display = "Man tavęs trūko, Marijana."
spoken = ""
voice = "robin"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 17
display = "Žinau, Robinai. Eik, eik, nerizikuok daugiau!"
spoken = ""
voice = "marian"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 18
display = "Tu teisi, iki pasimatymo, Marijana!"
spoken = ""
voice = "robin"
provenance = "machine-draft-lt"

[[line]]
id = 1000445
index = 19
display = "Iki pasimatymo, Robinai! Saugokis..."
spoken = ""
voice = "marian"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 0
display = "Robinas vėl Notingame. Pavojus didelis, bet jis taip seniai nematė Marianos! Tačiau kaip ją rasti? Kur ji dabar gyvena? Robinas nežino... Jam teks paklausti miesto gyventojų, bet neįtariant galbūt šlykščiam šerifui ar jo kariams... Didžiausia Robino baimė – kad Marijana atsisakys kalbėtis su paprastu nusikaltėliu..."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 1
display = "Atrodo, šis gerai maitinamas vienuolis vargu ar sutiks padėti tau rasti Marianą! Geriau jį apsvaiginti, kad galėtum užimti jo vietą. Kūną paslėpti zakristijoje atrodo gera mintis, bet būk atsargus – negali jo sužeisti!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 2
display = "Kelias laisvas: dabar Robinas gali tik pasislėpti išpažinčių kabinoje ir laukti Marianos!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 3
display = "Oi! Beveik pamiršau surišti šį storąjį vienuolį ir paslėpti jį zakristijoje!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 4
display = "Marijana nori kalbėti tik su Robinu!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 5
display = "Šerifo svainis yra piktas žmogus! Jis naudojasi šerifo įtaka ir apdeda miesto amatininkus sunkiais mokesčiais. Savo turtą jis slepia namuose. Jis vertas geros pamokos!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 6
display = "Pagal elgetą, čia gyvena šerifo svainis."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 7
display = "Oi! Mano vargšas sūnus! Jis buvo toks geras ir narsus berniukas! Bet buvo beprotybė taip priešintis šerifo vyrams! Ak, mano brangus vaikeli! Jo kūną pastatė kaip pavyzdį, bent jau taip sakė! O aš, jo vargšė motina, nebeturiu nieko... Netgi paguodos, kad galėsiu jį palaidoti šventoje žemėje!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 8
display = "Senutės, kurią sutiko Robinas, sūnus buvo nuteistas pakarti. Šerifas įsakė jo kūną savaitę laikyti viešai, kaip pavyzdį. Vargšė motina tikrai būtų dėkinga, jei Robinas nuimtų kūną, kad ji galėtų jį palaidoti..."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 9
display = "O! Mokytojau Robinai! Kokia dosni siela! Tokia kilni širdis! Rytoj atsiųstu kunigą, kuris padės man palaidoti mylimą sūnų, bet šį vakarą aš melsiuosi už jo sielą ir už tavo, jei leisi."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 10
display = "Ieškomas: Robinas Hudas; kaltas dėl to, kad išgelbėjo plėšiką Stiutlį nuo pelnyto bausmės; atlygis: 50 svarų"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 11
display = "Kiekvieną vakarą ledi Marijana susitinka su savo nuodėmklausiu Notingamo bažnyčioje. Keista, jei jos siela tokia tyra!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 12
display = "Ledi Marijana? Nieko tokio vardo negirdėjau..."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 13
display = "Ledi Marijana? Ypač pamaldi žmogus, tiesą sakant! Bet nežinau, kur ją galima rasti..."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 14
display = "Čia ledi Marianos gyvenamoji vieta."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 15
display = "Ledi Marianos nuodėmklausys gana keistas žmogus. Jis gali ir neleisti tau prie jos."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 16
display = "Ledi Marijana? Bet jos šiuo metu nėra namie! Šerifas pakvietė ją vakarienės!"
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000122
index = 17
display = "Kūnas nuimtas. Dabar turime jį nuvežti tai vargšei moteriai..."
spoken = ""
voice = "narrator"
provenance = "machine-draft-lt"

[[line]]
id = 1000351
index = 0
display = "Only Prince John could allow Robin to recover his lands and his honour, though it will not be easy to obtain an audience with him... But, perhaps he would agree to talk to Marian?"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000351
index = 1
display = "Only Prince John could allow Robin to recover his lands and his honour, though it will not be easy to obtain an audience with him... But, perhaps he would agree to talk to Marian?"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000352
index = 0
display = "After the capture of our young Hero, Marian sunk into a state of melancholy, and… What? Yes, all right, it's not very romantic, although melancholy is quite a romantic feeling, if you think about it… OK, OK, load a savegame game then…"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000352
index = 1
display = "\"Alas! You've just lost the last person on your team who has one of the skills required for this Mission! There's no way you can pull it off now… You've lost!\""
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000284
index = 0
display = "Marian is the only one that can help Robin now. He must find her."
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000284
index = 1
display = "But where can she be? Perhaps the beggars know something…"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000284
index = 2
display = "The best way to meet Marian is to wait for her in the confessional."
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000284
index = 3
display = "But first you must ensure you have the right confessor. Why not knock him out, tie him up and then hide him in the vestry?"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000284
index = 4
display = "Marian will help Robin; all we need to do is leave Nottingham before the alarm is raised…"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000284
index = 5
display = "The body of the son of a poor woman has been put on public display. We must take it down from the gallows!"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000284
index = 6
display = "We must deliver the body of the woman's son to her, so that she can give him a proper burial."
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000284
index = 7
display = "The Sheriff's brother-in-law is sure to have a large stash of money at home…"
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000284
index = 8
display = "Robin has discovered where Marian is living."
spoken = ""
voice = "none"
provenance = "machine-draft"

[[line]]
id = 1000284
index = 9
display = "Maid Marian is having supper with the Sheriff! There must be another way of making contact with her: we must keep questioning the beggars…"
spoken = ""
voice = "none"
provenance = "machine-draft"

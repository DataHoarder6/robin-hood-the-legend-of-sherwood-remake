[toolchain]
channel = "nightly-2026-10-21"
# rust-src backs the `-Zbuild-std` wasm-release publishes (see the README
# wasm section); clippy, rustfmt and cranelift serve linting, formatting and the
# dev/test codegen backend. All of them are components of this nightly, not
# separate packages, so the gate lints and formats with the same compiler that
# builds the tree. The wasm target is pinned so neither local builds nor CI
# need a manual `rustup target add`. x86_64-pc-windows-gnu is deliberately
# NOT pinned: only the release workflow cross-builds Windows, and pinning it
# would pull the Windows std into every toolchain install.
components = ["clippy", "rustc-codegen-cranelift-preview", "rust-src", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
